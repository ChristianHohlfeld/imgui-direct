name: Native C++ builds
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-windows-x64
          path: build/Release/imgui_direct.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-linux-x64
          path: build/imgui_direct
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Xcode
      - run: cmake --build build --config Release --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-macos
          path: build/Release/imgui_direct.app
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64
      - run: cmake --build build-ios --config Release -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-android -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-android --parallel 4
      - run: test -s build-android/libimgui_direct.so
