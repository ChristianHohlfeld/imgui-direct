name: Native C++ builds
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Assert Windows GUI subsystem (no console)
        shell: pwsh
        run: |
          $exe = [IO.File]::ReadAllBytes("build/Release/imgui_direct.exe")
          $peOffset = [BitConverter]::ToInt32($exe, 0x3c)
          $subsystem = [BitConverter]::ToInt16($exe, $peOffset + 24 + 68)
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem (2), actual subsystem: $subsystem"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-windows-x64
          path: build/Release/imgui_direct.exe
          if-no-files-found: error
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev ninja-build
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-linux-x64
          path: build/imgui_direct
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Xcode
      - run: cmake --build build --config Release --parallel 4
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-macos
          path: build/Release/imgui_direct.app
          if-no-files-found: error
  ios-simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64
      - run: cmake --build build-ios --config Release -- -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
      - name: Launch iPad simulator and capture screenshot
        timeout-minutes: 4
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/ios-devices.json
          UDID="$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/ios-devices.json'))
          devices=[d for group in data['devices'].values() for d in group if d.get('isAvailable')]
          devices.sort(key=lambda d:('iPad' not in d['name'], d['name']))
          if not devices: raise SystemExit('No available iOS simulator')
          print(devices[0]['udid'])
          PY
          )"
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-ios/Release-iphonesimulator/imgui_direct.app
          xcrun simctl launch "$UDID" de.imgui.direct.demo
          sleep 3
          xcrun simctl io "$UDID" screenshot /tmp/imgui-ipad.png
          test -s /tmp/imgui-ipad.png
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-ipad-simulator-screenshot
          path: /tmp/imgui-ipad.png
          if-no-files-found: warn
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-android -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-android --parallel 4
      - run: test -s build-android/libimgui_direct.so
      - name: Package Android installable APK without Gradle
        run: bash android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-android-arm64-debug
          path: build-android-java/imgui-direct-debug.apk
          if-no-files-found: error
