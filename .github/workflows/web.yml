name: Build WebAssembly + Deploy Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # Isolate from the run GitHub left in_progress after its deploy was cancelled.
  group: pages-recovery-${{ github.ref }}
  # A fresh main push supersedes a deploy stuck during a GitHub Pages outage.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.15'
      - run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web --parallel 4
      - run: test -s build-web/index.html && test -s build-web/index.js && test -s build-web/index.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-direct-web-wasm
          path: |
            build-web/index.html
            build-web/index.js
            build-web/index.wasm
          if-no-files-found: error
      - name: Stage only public application assets
        run: |
          mkdir -p site
          cp build-web/index.html build-web/index.js build-web/index.wasm site/
          touch site/.nojekyll
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > site/build.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
