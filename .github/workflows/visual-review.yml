name: Visual review (Chromium WebGL2)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install --with-deps chromium
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.15'
      - run: emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-web --parallel 4
      - name: Start local WebGL2 app
        run: |
          python3 -m http.server 8765 -d build-web > /tmp/visual-http.log 2>&1 &
          sleep 2
          curl --fail http://127.0.0.1:8765/index.html >/dev/null
      - name: Exercise all C++ components and capture WebGL2 rendering
        run: node tests/visual_review.mjs
        env:
          DEMO_URL: http://127.0.0.1:8765/index.html
      - name: Publish gallery visuals before long state matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-quick-sight-review
          retention-days: 7
          path: |
            visual-review/*catalog*.png
            visual-review/*list-after-scroll.png
          if-no-files-found: warn
      - name: Render every supported component state and test real interactions
        run: node tests/state_review.mjs
        env:
          DEMO_URL: http://127.0.0.1:8765/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-screenshots
          retention-days: 7
          path: visual-review/
          if-no-files-found: warn
