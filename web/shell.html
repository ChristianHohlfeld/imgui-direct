<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafc">
<title>Komponenten</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc;color:#111827;font-family:system-ui}#canvas{display:block;width:100vw;height:100dvh;touch-action:none;outline:none}#status{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;pointer-events:none;background:#f8fafc;color:#475569;font-size:14px;font-weight:500;letter-spacing:.01em}#status::before{content:"";width:24px;height:24px;border-radius:50%;border:2px solid #e2e8f0;border-top-color:#2563eb;animation:load 1s linear infinite}@keyframes load{to{transform:rotate(360deg)}}#status:empty{display:none}#native-input{display:none;position:fixed;margin:0;padding:0;border:0;z-index:3;opacity:.025;resize:none;background:transparent;color:transparent;caret-color:transparent;touch-action:auto;outline:none}
</style></head>
<body><canvas id="canvas" tabindex="0"></canvas><div id="status" role="status" aria-live="polite">Wird vorbereitet …</div>
<textarea id="native-input" autocomplete="on" autocapitalize="sentences" spellcheck="true"></textarea>
<script>var Module={canvas:document.getElementById('canvas'),onRuntimeInitialized:function(){/* status hides on the first rendered frame */},onAbort:function(x){document.getElementById('status').textContent='Die Anwendung konnte nicht gestartet werden: '+x},printErr:console.error.bind(console)};</script>
<script>
(function(){
  const input=document.getElementById('native-input');
  let composing=false;
  const call=(name,arg)=>window.Module && Module.ccall(name,null,arg?['string']:[],arg?[arg]:[]);
  input.addEventListener('focus',()=>call('mobile_focus'));
  input.addEventListener('compositionstart',()=>{composing=true});
  input.addEventListener('compositionend',()=>{
    composing=false;
    if(input.value)call('mobile_insert_utf8',input.value);
    input.value='';
  });
  input.addEventListener('beforeinput',e=>{
    if(!composing && e.inputType==='deleteContentBackward' && !input.value.length){
      e.preventDefault();call('mobile_backspace');
    }
  });
  input.addEventListener('input',()=>{
    if(composing)return;
    if(input.value){call('mobile_insert_utf8',input.value);input.value='';}
  });
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) input.blur();
  });
})();
</script>
<script>
// No extra UI framework. This is the minimum browser-specific pixel adapter.
// Device-pixel-content-box is authoritative where supported: unlike
// Math.round(cssSize * devicePixelRatio), it is aligned to the compositor's
// actual content box under fractional zoom / Windows DPI scaling.
(function () {
  const canvas = document.getElementById('canvas');
  const state = {
    cssWidth: 0, cssHeight: 0, pixelWidth: 0, pixelHeight: 0,
    exact: false, dpr: 1, source: 'initial', ready: false
  };
  let observed = null;
  function sizeFromLayout() {
    const rect = canvas.getBoundingClientRect();
    const cssWidth = rect.width;
    const cssHeight = rect.height;
    const dpr = window.devicePixelRatio || 1;
    if (!(cssWidth > 0 && cssHeight > 0)) return state;
    // If a devicePixelContentBox observation is stale, fall back until its
    // next delivery; never use old physical pixels with a new CSS viewport.
    // Some Chromium emulators expose the device-pixel content box as CSS
    // pixels while emulating a DPR > 1 (our screenshot QA caught this).
    // Never trust a device-pixel observation if it contradicts the effective
    // screen density by MORE than the <1px rounding uncertainty.
    const dprWidth = cssWidth * dpr, dprHeight = cssHeight * dpr;
    const observationCurrent = observed &&
      Math.abs(observed.cssWidth - cssWidth) < 1e-5 &&
      Math.abs(observed.cssHeight - cssHeight) < 1e-5 &&
      observed.dpr === dpr;
    const useObserved = observationCurrent &&
      Math.abs(observed.pixelWidth - dprWidth) <= 1.01 &&
      Math.abs(observed.pixelHeight - dprHeight) <= 1.01;
    const pxWidth = useObserved ? observed.pixelWidth : Math.round(dprWidth);
    const pxHeight = useObserved ? observed.pixelHeight : Math.round(dprHeight);
    const width = Math.max(1, pxWidth), height = Math.max(1, pxHeight);
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
    Object.assign(state, {
      cssWidth, cssHeight, pixelWidth: width, pixelHeight: height, dpr,
      exact: !!useObserved,
      source: useObserved ? 'device-pixel-content-box' :
        (observationCurrent ? 'dpr-fallback-unreliable-observation' : 'dpr-fallback'),
      ready: true
    });
    return state;
  }
  const observer = new ResizeObserver(entries => {
    const entry = entries.find(e => e.target === canvas);
    if (entry && entry.devicePixelContentBoxSize) {
      const box = Array.isArray(entry.devicePixelContentBoxSize)
        ? entry.devicePixelContentBoxSize[0] : entry.devicePixelContentBoxSize;
      const r = canvas.getBoundingClientRect();
      observed = {
        pixelWidth: box.inlineSize, pixelHeight: box.blockSize,
        cssWidth: r.width, cssHeight: r.height,
        dpr: window.devicePixelRatio || 1
      };
    } else observed = null;
    sizeFromLayout();
  });
  try {
    observer.observe(canvas, { box: 'device-pixel-content-box' });
  } catch {
    observer.observe(canvas);
  }
  window.__imguiCanvasPixels = { state, sync: sizeFromLayout };
  window.addEventListener('resize', sizeFromLayout, { passive: true });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', sizeFromLayout, { passive: true });
  }
  // Ensure the canvas has the right backing size even on its FIRST WebGL frame.
  sizeFromLayout();
})();
</script>
